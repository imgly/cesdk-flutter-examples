plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.github.gmazzo.buildconfig'
}

def getKotlinVersion() {
    return project.plugins.findPlugin("kotlin-android")?.class?.package?.implementationVersion
}

def isKotlin2OrHigher() {
    def kotlinVersion = getKotlinVersion()
    if (kotlinVersion) {
        def mainVersion = kotlinVersion.split('-')[0]
        def versionParts = mainVersion.tokenize('.').collect { it.toInteger() }
        return versionParts[0] >= 2
    }
    return false
}

// Kotlin 2 (the effective version under Flutter 3.44+) requires the Compose Compiler Gradle
// plugin when compose is enabled; older Kotlin keeps the composeOptions block below. This
// adapted from the imgly plugins' own android/build.gradle — without their
// UnknownPluginException guard, because settings.gradle here declares the plugin
// (apply false), so it is always on the classpath.
if (isKotlin2OrHigher()) {
    project.plugins.apply('org.jetbrains.kotlin.plugin.compose')
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

buildConfig {
    className "ShowcasesFlutterBuildConfig"
    packageName "ly.img.editor.flutter"
    buildConfigField String, "UNSPLASH_HOST", System.env.CESDK_AND_UNSPLASH_HOST ?: localProperties.getProperty("unsplash_host") ?: ""
}

def engineInternalDeploy = Boolean.parseBoolean(System.getenv("UBQ_ANDROID_INTERNAL_DEPLOY") ?: "false")

android {
    namespace = "ly.img.editor.flutter.showcases"
    compileSdk = 35 // flutter.compileSdkVersion is 34, remove hardcode when flutter updates this value
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "ly.img.editor.flutter.showcases"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        // highlight-minsdk
        minSdk = 24
        // highlight-minsdk
        targetSdk = 35 // flutter.targetSdkVersion is 34, remove hardcode when flutter updates this value
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        // Runs the Flutter `integration_test` suite as an on-device instrumented test (required for
        // Firebase Test Lab and UiAutomation screenshots); MainActivityTest delegates to FlutterTestRunner.
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders += [
            imglyEngineInternalDeploy: engineInternalDeploy,
            imglyEngineStagingLicense: engineInternalDeploy,
            imglyEngineLogging: engineInternalDeploy,
        ]
    }

    signingConfigs {
        release {
            storeFile rootProject.file("android-release.keystore")
            storePassword System.getenv("CESDK_AND_KEYSTORE_PWD") ?: localProperties.getProperty("release_key_password")
            keyAlias "cesdk-dev"
            keyPassword System.getenv("CESDK_AND_KEYSTORE_PWD") ?: localProperties.getProperty("release_key_password")
        }
    }

    buildTypes {
        release {
            def shrinkAndMinifyEnabled = System.getenv("CESDK_SHRINK_AND_MINIFY_ENABLED") == null
              || System.getenv("CESDK_SHRINK_AND_MINIFY_ENABLED") == "true"
            signingConfig signingConfigs.release
            minifyEnabled shrinkAndMinifyEnabled
            shrinkResources shrinkAndMinifyEnabled
        }
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
      compose true
    }

    if (!isKotlin2OrHigher()) {
        composeOptions {
            kotlinCompilerExtensionVersion = "1.5.3"
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Only JUnit is declared here (for the FlutterTestRunner entry point in MainActivityTest.java).
    // The integration_test plugin already provides androidx.test runner/rules/espresso and
    // androidx.test:monitor transitively via `1.2+`, so re-declaring any of those with a fixed
    // version breaks Gradle consistent resolution; JUnit's version must match the pinned 4.12.
    androidTestImplementation "junit:junit:4.12"
}
