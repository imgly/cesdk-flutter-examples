import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
    // The Flutter Gradle Plugin must be applied after the Android Gradle plugin.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.github.gmazzo.buildconfig'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def getSdkVersion(String overrideProperty, int fallback) {
    def override = project.findProperty(overrideProperty)
    return override == null ? fallback : Math.max(fallback, override.toString().toInteger())
}

def compileSdkVersion = getSdkVersion("ly.img.flutter.compileSdkVersionOverride", flutter.compileSdkVersion)
def targetSdkVersion = getSdkVersion("ly.img.flutter.targetSdkVersionOverride", flutter.targetSdkVersion)

buildConfig {
    className "ShowcasesFlutterBuildConfig"
    packageName "ly.img.editor.flutter"
    buildConfigField String, "UNSPLASH_HOST", System.env.CESDK_AND_UNSPLASH_HOST ?: localProperties.getProperty("unsplash_host") ?: ""
}

def engineInternalDeploy = Boolean.parseBoolean(System.getenv("UBQ_ANDROID_INTERNAL_DEPLOY") ?: "false")

android {
    namespace = "ly.img.editor.flutter.showcases"
    compileSdk = compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "ly.img.editor.flutter.showcases"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        // highlight-minsdk
        minSdk = 24
        // highlight-minsdk
        targetSdk = targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        // Runs the Flutter `integration_test` suite as an on-device instrumented test (required for
        // Firebase Test Lab and UiAutomation screenshots); MainActivityTest delegates to FlutterTestRunner.
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders += [
            imglyEngineInternalDeploy: engineInternalDeploy,
            imglyEngineStagingLicense: engineInternalDeploy,
            imglyEngineLogging: engineInternalDeploy,
        ]
    }

    signingConfigs {
        release {
            storeFile rootProject.file("android-release.keystore")
            storePassword System.getenv("CESDK_AND_KEYSTORE_PWD") ?: localProperties.getProperty("release_key_password")
            keyAlias "cesdk-dev"
            keyPassword System.getenv("CESDK_AND_KEYSTORE_PWD") ?: localProperties.getProperty("release_key_password")
        }
    }

    buildTypes {
        release {
            def shrinkAndMinifyEnabled = System.getenv("CESDK_SHRINK_AND_MINIFY_ENABLED") == null
              || System.getenv("CESDK_SHRINK_AND_MINIFY_ENABLED") == "true"
            signingConfig signingConfigs.release
            minifyEnabled shrinkAndMinifyEnabled
            shrinkResources shrinkAndMinifyEnabled
        }
    }

    buildFeatures {
        compose true
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_1_8
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Only JUnit is declared here (for the FlutterTestRunner entry point in MainActivityTest.java).
    // The integration_test plugin already provides androidx.test runner/rules/espresso and
    // androidx.test:monitor transitively via `1.2+`, so re-declaring any of those with a fixed
    // version breaks Gradle consistent resolution; JUnit's version must match the pinned 4.12.
    androidTestImplementation "junit:junit:4.12"
}
